name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing tag (vYY.MM.DD)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}

jobs:
  validate:
    name: Validate the release
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::Release tag must use vYY.MM.DD."
            exit 1
          fi

      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.release_ref) }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check package version
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from runpy import run_path

          tag = os.environ["RELEASE_TAG"]
          version = run_path("src/config.py")["VERSION"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match REQL version {version}.")
          try:
              datetime.strptime(version, "%y.%m.%d")
          except ValueError:
              raise SystemExit(f"REQL version {version} must be a valid calendar date.") from None
          PY

      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          try:
              changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
              heading = rf"^## \[{re.escape(tag)}\](?: - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}})?[ \t]*$"
              sections = list(re.finditer(heading, changelog, re.MULTILINE))
              if len(sections) != 1:
                  raise ValueError(f"CHANGELOG.md must contain exactly one section for {tag}.")

              body = changelog[sections[0].end():]
              next_heading = re.search(r"^## ", body, re.MULTILINE)
              notes = (body[:next_heading.start()] if next_heading else body).strip("\n")
              if not notes.strip():
                  raise ValueError(f"CHANGELOG.md has no release notes for {tag}.")

              Path("release-notes.md").write_text(notes + "\n", encoding="utf-8", newline="\n")
          except (OSError, ValueError) as error:
              raise SystemExit(str(error)) from None
          PY

      - name: Install REQL
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --notes-file release-notes.md --title "REQL $RELEASE_TAG"
