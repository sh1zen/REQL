[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "reql"
dynamic = ["version"]
description = "Relational Entities Query Language: a graph-native deterministic memory engine."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sh1zen"}]
keywords = [
  "agents",
  "graph",
  "knowledge-graph",
  "memory",
  "property-graph",
  "query-language",
  "skill",
  "llm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "tree-sitter>=0.25,<0.28",
  "tree-sitter-bash>=0.25.1",
  "tree-sitter-c>=0.24.2",
  "tree-sitter-c-sharp>=0.24.0",
  "tree-sitter-cpp>=0.23.4",
  "tree-sitter-elixir>=0.3.5",
  "tree-sitter-fortran>=0.6",
  "tree-sitter-go>=0.25",
  "tree-sitter-hcl>=1.2",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-julia>=0.23.1",
  "tree-sitter-kotlin>=1.1",
  "tree-sitter-language-pack>=1.23.1; python_version < '3.11'",
  "tree-sitter-language-pack>=1.25.2; python_version >= '3.11'",
  "tree-sitter-lua>=0.5",
  "tree-sitter-make>=1.1.1",
  "tree-sitter-php>=0.25.2",
  "tree-sitter-powershell>=0.26.4",
  "tree-sitter-python>=0.25",
  "tree-sitter-ruby>=0.23.1",
  "tree-sitter-rust>=0.24.2",
  "tree-sitter-scala>=0.26.13",
  "tree-sitter-solidity>=1.2.13",
  "tree-sitter-sql>=0.3.13",
  "tree-sitter-swift>=0.7.4",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-verilog>=1.0.3",
  "tree-sitter-zig>=1.1.2",
]

[project.optional-dependencies]
pdf = ["pypdf>=7.1.1"]
all = ["pypdf>=7.1.1"]
dev = [
  "coverage[toml]>=7.16.2,<8; python_version < '3.11'",
  "coverage[toml]>=7.17.5,<8; python_version >= '3.11'",
  "pypdf>=7.1.1",
]

[project.urls]
Documentation = "https://github.com/sh1zen/reql#readme"
Issues = "https://github.com/sh1zen/reql/issues"
Source = "https://github.com/sh1zen/reql"

[project.scripts]
reql = "memory.cli:main"
reql-mcp = "mcp.server:main"

[tool.setuptools]
py-modules = ["config", "reql"]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "config.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents = ["py.typed", "gen-skill.py"]
api = ["py.typed"]
memory = ["py.typed"]
config = ["core.yaml", "user.yaml"]
"memory.reporting" = ["vendor/vis-network.min.js", "vendor/vis-network.LICENSE-MIT"]
mcp = ["py.typed"]

[tool.coverage.run]
branch = true
source_pkgs = ["agents", "api", "memory", "mcp", "reql"]
relative_files = true
data_file = ".tmp/coverage/.coverage"
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".tmp/coverage/html"

[tool.coverage.xml]
output = ".tmp/coverage/coverage.xml"

[tool.coverage.json]
output = ".tmp/coverage/coverage.json"
